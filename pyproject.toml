[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "screenbridge"
version = "0.8.1"
description = "Screenshot-to-AI relay with a mobile result screen"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "qrcode>=8,<9",
]

[project.optional-dependencies]
desktop = ["mss>=10,<11", "pynput>=1.8,<2"]
build = ["pyinstaller>=6.16,<7"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "playwright>=1.50,<2", "ruff>=0.11,<1"]

[project.scripts]
screenbridge = "screenbridge.cli:main"
screenbridge-app = "screenbridge.launcher:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
